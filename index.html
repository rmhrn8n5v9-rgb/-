<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>座席管理システム</title>

    <link
        rel="stylesheet"
        href="style.css?v=7"
    >
</head>

<body>

    <h1>座席管理システム</h1>


    <!-- =====================================
         受付
    ====================================== -->

    <div class="reception-wrapper">

        <!-- ACEG -->
        <div class="reception aceg-reception">

            <h2>ACEGブロック受付</h2>

            <div class="reception-area">

                <input
                    id="acegCustomerCount"
                    class="customer-count"
                    type="number"
                    min="1"
                >

                <span>名</span>

                <button
                    id="acegReceptionButton"
                    class="reception-button"
                >
                    受付
                </button>

            </div>


            <div class="people-summary">

                <div>
                    確定人数：
                    <span id="acegConfirmedCount">0</span>人
                </div>

                <div>
                    待ち人数：
                    <span id="acegWaitingCount">0</span>人
                </div>

                <div class="total-count">
                    合計人数：
                    <span id="acegTotalCount">0</span>人
                </div>

            </div>


            <button
                id="acegNextButton"
                class="next-button"
            >
                次のお客様を案内
            </button>


            <div
                id="acegCurrentCustomer"
                class="current-customer"
            >
                現在案内中のお客様はいません
            </div>


            <button
                id="acegConfirmButton"
                class="confirm-button"
                disabled
            >
                座席を確定
            </button>


            <div
                id="acegWaitingList"
                class="waiting-list"
            >
                待ちはありません
            </div>

        </div>


        <!-- BDFH -->
        <div class="reception bdfh-reception">

            <h2>BDFHブロック受付</h2>

            <div class="reception-area">

                <input
                    id="bdfhCustomerCount"
                    class="customer-count"
                    type="number"
                    min="1"
                >

                <span>名</span>

                <button
                    id="bdfhReceptionButton"
                    class="reception-button"
                >
                    受付
                </button>

            </div>


            <div class="people-summary">

                <div>
                    確定人数：
                    <span id="bdfhConfirmedCount">0</span>人
                </div>

                <div>
                    待ち人数：
                    <span id="bdfhWaitingCount">0</span>人
                </div>

                <div class="total-count">
                    合計人数：
                    <span id="bdfhTotalCount">0</span>人
                </div>

            </div>


            <button
                id="bdfhNextButton"
                class="next-button"
            >
                次のお客様を案内
            </button>


            <div
                id="bdfhCurrentCustomer"
                class="current-customer"
            >
                現在案内中のお客様はいません
            </div>


            <button
                id="bdfhConfirmButton"
                class="confirm-button"
                disabled
            >
                座席を確定
            </button>


            <div
                id="bdfhWaitingList"
                class="waiting-list"
            >
                待ちはありません
            </div>

        </div>

    </div>
<!-- =====================================
     完全リセット
====================================== -->

<div class="reset-area">

    <button
        id="resetOpenButton"
        class="reset-open-button"
    >
        全データをリセット
    </button>

</div>


<!-- リセット確認 -->

<div
    id="resetConfirmArea"
    class="reset-confirm-area"
>

    <div class="reset-confirm-box">

        <div class="reset-warning">
            ⚠️ 本当に全データをリセットしますか？
        </div>

        <div class="reset-description">
            受付番号・待ち人数・確定人数・案内中・
            全座席の使用状況がすべて消えます。
        </div>

        <div class="reset-buttons">

            <button
                id="resetExecuteButton"
                class="reset-execute-button"
            >
                完全リセットを確定
            </button>

            <button
                id="resetCancelButton"
                class="reset-cancel-button"
            >
                キャンセル
            </button>

        </div>

    </div>

</div>

    <!-- =====================================
         座席操作モード
    ====================================== -->

    <div class="seat-mode-area">

        <button
            id="seatModeButton"
            class="seat-mode-button"
        >
            範囲選択を開始
        </button>

        <div
            id="seatModeMessage"
            class="seat-mode-message"
        >
            通常モード：座席の上からスクロールできます
        </div>

    </div>


    <!-- =====================================
         舞台
    ====================================== -->

    <div class="stage">
        舞台側
    </div>


    <div id="seats"></div>


    <div class="back">
        後方
    </div>


    <!-- =====================================
         一括変更の確認
    ====================================== -->

    <div
        id="bulkActionBar"
        class="bulk-action-bar"
    >

        <div
            id="bulkActionText"
            class="bulk-action-text"
        >
            0席選択中
        </div>


        <div class="bulk-action-buttons">

            <button
                id="bulkConfirmButton"
                class="bulk-confirm-button"
            >
                確定
            </button>

            <button
                id="bulkCancelButton"
                class="bulk-cancel-button"
            >
                キャンセル
            </button>

        </div>

    </div>


    <script
        type="module"
        src="script.js?v=10"
    ></script>

</body>

</html>
